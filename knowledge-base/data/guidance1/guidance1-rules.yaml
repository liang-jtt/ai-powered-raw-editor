rules:
  - {id: r-underexposed-global, knowledge_kind: rule, source_id: rawpedia-exposure, photo_type: RAW with low midtones, observable: histogram compressed left, diagnosis: global underexposure, preconditions: inspect unclipped highlights, preferred_actions: [raise Exposure Compensation gradually, recheck histogram], avoid_actions: [raising shadows alone], exceptions: high-key intent, quality_checks: histogram and skin/neutral patch, confidence: high, needs_validation: false}
  - {id: r-overexposed-global, knowledge_kind: rule, source_id: rawpedia-exposure, photo_type: RAW with right-edge clipping, observable: clipped indicator black areas, diagnosis: channel clipping, preconditions: inspect raw histogram, preferred_actions: [lower Exposure Compensation, enable Highlight Reconstruction], avoid_actions: [expecting recovery of all-channel clipping], exceptions: intentional pure-white areas, quality_checks: highlight texture and no gray whites, confidence: high, needs_validation: false}
  - {id: r-highlight-compress, knowledge_kind: rule, source_id: rawpedia-exposure, photo_type: RAW with recoverable bright areas, observable: channels bunch at right edge after edits, diagnosis: editable data clipped in pipeline, preconditions: HR enabled, preferred_actions: [increase Highlight Compression until channels touch edge], avoid_actions: [over-compressing past gray-white transition], exceptions: scenes lacking dynamic range, quality_checks: histogram touches both ends, confidence: high, needs_validation: false}
  - {id: r-warm-cast, knowledge_kind: rule, source_id: rawpedia-white-balance, photo_type: neutral-reference scene, observable: neutral object orange/yellow, diagnosis: temperature too high, preconditions: known neutral sample, preferred_actions: [adjust Temperature cooler, verify RGB equality], avoid_actions: [using WB for creative cast], exceptions: intentional warm lighting, quality_checks: RGB bars overlap, confidence: high, needs_validation: false}
  - {id: r-cool-cast, knowledge_kind: rule, source_id: rawpedia-white-balance, photo_type: neutral-reference scene, observable: neutral object blue, diagnosis: temperature too low, preconditions: known neutral sample, preferred_actions: [adjust Temperature warmer, verify neutral], avoid_actions: [trusting display alone], exceptions: blue-hour intent, quality_checks: Lab a*/b* near match, confidence: high, needs_validation: false}
  - {id: r-green-magenta-cast, knowledge_kind: rule, source_id: rawpedia-white-balance, photo_type: scene with gray/white reference, observable: green or magenta tint, diagnosis: Tint axis error, preconditions: neutral patch, preferred_actions: [adjust Tint opposite cast], avoid_actions: [compensating with saturation], exceptions: fluorescent/LED spectral issues, quality_checks: neutral sample and skin tones, confidence: high, needs_validation: false}
  - {id: r-high-iso-chroma, knowledge_kind: rule, source_id: rawpedia-noise-reduction, photo_type: high-ISO RAW, observable: colored blotches in flat areas, diagnosis: chrominance noise, preconditions: view at 100%+, preferred_actions: [enable Noise Reduction chrominance], avoid_actions: [judging only fit-to-screen], exceptions: retain intentional color grain, quality_checks: flat areas lose blotches without color bleed, confidence: high, needs_validation: false}
  - {id: r-high-iso-luma, knowledge_kind: rule, source_id: rawpedia-noise-reduction, photo_type: high-ISO RAW, observable: grain-like brightness variation, diagnosis: luminance noise, preconditions: chroma noise addressed, preferred_actions: [set Detail recovery 0, raise Luminance, restore Detail recovery], avoid_actions: [max smoothing immediately], exceptions: film-grain aesthetic, quality_checks: texture retained in detail areas, confidence: high, needs_validation: false}
  - {id: r-soft-detail, knowledge_kind: rule, source_id: rawpedia-sharpening, photo_type: in-focus low-ISO image, observable: edges lack acutance, diagnosis: insufficient edge contrast, preconditions: noise reduction complete, preferred_actions: [USM with small radius, tune Amount], avoid_actions: [sharpening before denoise], exceptions: motion blur, quality_checks: 100% edge crispness, confidence: high, needs_validation: false}
  - {id: r-halo-over-sharpen, knowledge_kind: rule, source_id: rawpedia-sharpening, photo_type: any sharpened image, observable: bright/dark halos around edges, diagnosis: radius/amount too high or threshold too broad, preconditions: inspect 1:1, preferred_actions: [reduce radius/amount, tighten Threshold, enable Halo Control], avoid_actions: [compensating with contrast], exceptions: none known, quality_checks: neutral edge transitions, confidence: high, needs_validation: false}
  - {id: r-shadow-gray-haze, knowledge_kind: rule, source_id: rawpedia-exposure, photo_type: contrasty RAW, observable: lifted shadows look gray/flat, diagnosis: excessive shadow/black lift, preconditions: inspect black point, preferred_actions: [restore Black/Shadow Compression balance], avoid_actions: [global contrast boost as sole fix], exceptions: deliberate low-contrast scene, quality_checks: histogram black endpoint and local contrast, confidence: medium, needs_validation: true}
  - {id: r-denoise-texture-loss, knowledge_kind: rule, source_id: rawpedia-noise-reduction, photo_type: high-ISO detailed subject, observable: hair/fine texture smeared, diagnosis: luminance reduction/detail recovery imbalance, preconditions: 100% inspection, preferred_actions: [lower Luminance, increase Detail recovery moderately], avoid_actions: [using median as primary denoise], exceptions: output reduced for web, quality_checks: repeated texture and edges preserved, confidence: high, needs_validation: false}
